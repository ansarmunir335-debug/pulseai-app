<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseAI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="PulseAI Logo" class="brand-logo">
                <h2>PulseAI</h2>
            </div>
            <button class="new-chat-btn">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?name=User&background=8a2be2&color=fff" alt="User Avatar" class="avatar">
                <span>User Account</span>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <header class="chat-header">
                <h3>PulseAI Engine <i class="fa-solid fa-chevron-down"></i></h3>
                <div class="header-actions">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-gear"></i>
                </div>
            </header>

            <!-- Messages Stream -->
            <div class="chat-container" id="chat-container">
                <!-- Dynamic messages will append here -->
            </div>

            <!-- Input Controls -->
            <div class="input-container">
                <div class="input-wrapper">
                    <input type="text" id="user-input" class="message-input" placeholder="Message PulseAI..." autocomplete="off" />
                    <button id="send-btn" class="send-btn purple-btn">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
                <p class="disclaimer">PulseAI may produce inaccurate info. Verify critical details.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
