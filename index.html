<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseAI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="brand">
                    <img src="logo.png" alt="PulseAI Logo" class="brand-logo">
                    <h2>PulseAI</h2>
                </div>
                <button class="new-chat-btn" id="new-chat-btn">
                    <i class="fa-solid fa-plus"></i> New Chat
                </button>
            </div>
            <div class="user-profile">
                <div class="avatar">P</div>
                <span>User Account</span>
            </div>
        </aside>

        <!-- Main Chat Section -->
        <main class="chat-main">
            <header class="chat-header">
                <h3>PulseAI Engine <i class="fa-solid fa-chevron-down"></i></h3>
                <div class="header-actions">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-gear"></i>
                </div>
            </header>

            <!-- Chat Messages Container -->
            <div class="chat-container" id="chat-container">
                <!-- Messages will appear here dynamically -->
            </div>

            <!-- Bottom Input Section -->
            <div class="input-container">
                <div class="input-wrapper">
                    <input type="text" id="user-input" class="message-input" placeholder="Message PulseAI..." autocomplete="off">
                    
                    <!-- Active Models Dropdown (Left of Send Button) -->
                    <!-- Naya Working Code -->
<select id="model-select" class="model-dropdown">
    <option value="openai/gpt-oss-120b">GPT OSS 120B (OpenAI Flagship)</option>
    <option value="openai/gpt-oss-20b">GPT OSS 20B (OpenAI Fast)</option>
    <option value="llama-3.1-8b-instant">Llama 3.1 8B Instant</option>
    <option value="llama-3.1-70b-versatile">Llama 3.1 70B Versatile</option>
</select>

                    <!-- Send Button -->
                    <button id="send-btn" class="send-btn purple-btn" title="Send Message">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
                <p class="disclaimer">PulseAI may produce inaccurate info. Verify critical details.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
